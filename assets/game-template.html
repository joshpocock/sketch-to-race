<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__RACE_TITLE__</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script id="race-config" type="application/json">__RACE_CONFIG__</script>
<script>
(function () {
'use strict';

/* Sketch to Race game template. Everything is drawn on one canvas. No network, no files. */

var CFG = JSON.parse(document.getElementById('race-config').textContent);
var CAR = CFG.car, RACE = CFG.race;

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, U = 1;
function resize() {
  var k = Math.min(1, 1280 / Math.max(1, window.innerWidth));
  W = canvas.width = Math.max(320, Math.round(window.innerWidth * k));
  H = canvas.height = Math.max(200, Math.round(window.innerHeight * k));
  U = Math.min(W, H * 1.6) / 1000;
}
window.addEventListener('resize', resize);
resize();

/* ---------- random numbers (seeded, so the same car gets the same city) ---------- */
function makeRng(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rnd = makeRng(RACE.seed);
function rand(a, b) { return a + (b - a) * rnd(); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(list) { return list[Math.floor(rnd() * list.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- colours ---------- */
var rgbCache = {};
function rgb(h) {
  var c = rgbCache[h];
  if (!c) { var n = parseInt(h.slice(1), 16); c = rgbCache[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  return c;
}
function hex(r, g, b) {
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}
function mix(a, b, t) {
  if (t <= 0.004) return a;
  if (t >= 1) return b;
  var A = rgb(a), B = rgb(b);
  return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function shade(h, f) { return f < 0 ? mix(h, '#000000', -f) : mix(h, '#ffffff', f); }
function rgba(h, a) { var c = rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function colourDistance(a, b) {
  var A = rgb(a), B = rgb(b);
  return Math.sqrt(Math.pow(A[0] - B[0], 2) + Math.pow(A[1] - B[1], 2) + Math.pow(A[2] - B[2], 2));
}

/* ---------- theme ---------- */
var NIGHT = RACE.time === 'night', DUSK = RACE.time === 'dusk', RAIN = RACE.weather === 'rain';
var T = {
  skyTop: '#2f6fd0', skyBot: '#bfe0f7', fog: '#c4d8e6', sun: '#fff4d2',
  road: '#56585e', road2: '#525459', curb1: '#e4e4e4', curb2: '#b8222c',
  walk1: '#9b9da1', walk2: '#929498', lane: '#f2f2f2', skyline: '#8196ab'
};
if (DUSK) {
  T.skyTop = '#2b1d4a'; T.skyBot = '#f39a5a'; T.fog = '#c98a6a'; T.sun = '#ffcf86'; T.skyline = '#4b3a5e';
  T.walk1 = '#86807f'; T.walk2 = '#7e7877';
}
if (NIGHT) {
  T.skyTop = '#03050c'; T.skyBot = '#1b2142'; T.fog = '#151a30'; T.sun = '#e8ecff';
  T.road = '#2b2d32'; T.road2 = '#28292e'; T.walk1 = '#3d3f45'; T.walk2 = '#393b41';
  T.curb1 = '#9a9a9a'; T.curb2 = '#6e1a20'; T.lane = '#cfcfcf'; T.skyline = '#0d1122';
}
if (RAIN) {
  var grey = NIGHT ? '#10131c' : '#69707c';
  T.skyTop = mix(T.skyTop, grey, 0.65); T.skyBot = mix(T.skyBot, grey, 0.55);
  T.fog = mix(T.fog, grey, 0.55); T.skyline = mix(T.skyline, grey, 0.4);
  T.road = shade(T.road, -0.25); T.road2 = shade(T.road2, -0.25);
  T.walk1 = shade(T.walk1, -0.2); T.walk2 = shade(T.walk2, -0.2);
}
var FOG_DENSITY = RAIN ? 7 : (NIGHT ? 5.5 : 4);

/* ---------- road geometry ---------- */
var SEG = 200, ROAD_W = 2000, LANES = 3, RUMBLE = 3, DRAW = 260;
var CAM_H = 1500, CAM_D = 1 / Math.tan(50 * Math.PI / 180);
var PLAYER_Z = CAM_H * CAM_D;
var MAX_SPEED = SEG * 60;
var ACCEL = MAX_SPEED / 5, BRAKE = -MAX_SPEED, DECEL = -MAX_SPEED / 5;
var OFFROAD_DECEL = -MAX_SPEED / 2, OFFROAD_LIMIT = MAX_SPEED / 4;
var CENTRIFUGAL = RAIN ? 0.36 : 0.3;
var CAR_W = 700, HIT_W = CAR_W / ROAD_W * 0.9;
var LANE_X = [-2 / 3, 0, 2 / 3];

var segments = [];
function lastY() { return segments.length ? segments[segments.length - 1].p2.world.y : 0; }
function addSegment(curve, y) {
  var n = segments.length;
  segments.push({
    index: n, curve: curve, sprites: [], cars: [], fog: 0, visible: false,
    p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { y: y, z: (n + 1) * SEG }, camera: {}, screen: {} },
    alt: Math.floor(n / RUMBLE) % 2
  });
}
function easeIn(a, b, p) { return a + (b - a) * p * p; }
function easeInOut(a, b, p) { return a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5); }
function addRoad(enter, hold, leave, curve, height) {
  var sy = lastY(), ey = sy + height * SEG, total = enter + hold + leave, i;
  for (i = 0; i < enter; i++) addSegment(easeIn(0, curve, i / enter), easeInOut(sy, ey, i / total));
  for (i = 0; i < hold; i++) addSegment(curve, easeInOut(sy, ey, (enter + i) / total));
  for (i = 0; i < leave; i++) addSegment(easeInOut(curve, 0, i / leave), easeInOut(sy, ey, (enter + hold + i) / total));
}

function buildTrack() {
  addRoad(30, 40, 30, 0, 0);
  var guard = 0;
  while (segments.length < 2300 && guard++ < 60) {
    var kind = pick(['curve', 'curve', 'curve', 'esses', 'straight', 'hill']);
    var dir = rnd() < 0.5 ? -1 : 1;
    var bend = pick([2, 3, 4, 5]) * dir;
    var hill = Math.abs(lastY()) > 2400 ? -lastY() / SEG * 0.6 : rand(-10, 10);
    var len = randInt(25, 55);
    if (kind === 'curve') addRoad(len, randInt(30, 70), len, bend, rnd() < 0.4 ? hill : 0);
    else if (kind === 'esses') { addRoad(25, 30, 25, bend, 0); addRoad(25, 30, 25, -bend, 0); }
    else if (kind === 'straight') addRoad(25, randInt(50, 110), 25, 0, rnd() < 0.5 ? hill : 0);
    else addRoad(len, randInt(20, 50), len, 0, hill);
  }
  addRoad(50, 40, 50, pick([-2, 2]), -lastY() / SEG);
  addRoad(30, 60, 30, 0, 0);
  segments[segments.length - 1].p2.world.y = 0;
  var startIndex = Math.floor(PLAYER_Z / SEG);
  segments[startIndex].start = true;
  segments[startIndex + 1].start = true;
  segments[startIndex + 2].sprites.push({ kind: 'banner' });
  for (var c = 400; c < segments.length - 200; c += randInt(320, 520)) {
    for (var k = 0; k < 4; k++) segments[c + k].cross = true;
  }
}
buildTrack();
var TRACK_LEN = segments.length * SEG;

function wrapZ(z) { while (z >= TRACK_LEN) z -= TRACK_LEN; while (z < 0) z += TRACK_LEN; return z; }
function ahead(a, b) { var d = a - b; if (d < 0) d += TRACK_LEN; if (d >= TRACK_LEN) d -= TRACK_LEN; return d; }
function findSegment(z) {
  var n = segments.length;
  return segments[((Math.floor(z / SEG) % n) + n) % n];
}

/* ---------- the city along the road ---------- */
var FACADES = ['#8d5a4a', '#a86b55', '#c9b79c', '#7d8590', '#5d6873', '#b5a58b', '#6e4f45', '#9aa5ae', '#4f6d7a', '#c2a477', '#7b6d8d'];
var AWNINGS = ['#b3202a', '#1f6f50', '#2a4d8f', '#d08c1f', '#5b2a86', '#c2410c'];
var NEON = ['#ff4fa3', '#4fe3ff', '#ffe14f', '#7dff6a', '#ff8a3d'];
var SIGNS = ['DINER', 'GARAGE', 'HOTEL', 'PIZZA', 'ARCADE', 'BOOKS', 'TACOS', 'TIRES', 'RECORDS', 'GYM', 'BAKERY', 'NOODLES', 'CINEMA', 'MOTEL', 'CAFE', 'PARTS', 'LAUNDRY', 'FLOWERS'];
function buildCity() {
  [-1, 1].forEach(function (side) {
    var i = randInt(0, 6);
    while (i < segments.length) {
      if (!segments[i].start) {
        segments[i].sprites.push({
          kind: 'building', side: side, offset: side * rand(1.5, 1.7),
          w: rand(1800, 3400), h: rand(2600, 9500), color: pick(FACADES), awning: pick(AWNINGS),
          neon: pick(NEON), sign: rnd() < 0.45 ? pick(SIGNS) : null, glass: rnd() < 0.22, seed: randInt(1, 999999)
        });
      }
      i += randInt(5, 9);
    }
  });
  for (var j = 6; j < segments.length; j += 12) {
    segments[j].sprites.push({ kind: 'lamp', offset: (j / 12) % 2 < 1 ? -1.24 : 1.24 });
  }
}
buildCity();

var SKY = [];
(function () {
  var x = 0;
  while (x < 1) {
    var w = rand(0.008, 0.03);
    var dots = [];
    for (var d = 0; d < 4; d++) dots.push([rnd(), rnd()]);
    SKY.push({ x: x, w: w, h: rand(0.05, 0.26), dots: dots });
    x += w * rand(0.8, 1.05);
  }
})();
var STARS = [];
for (var s = 0; s < 90; s++) STARS.push([rnd(), rnd() * 0.45, rnd()]);
var DROPS = [];
for (var d = 0; d < 170; d++) DROPS.push({ x: rnd(), y: rnd(), l: rand(0.03, 0.07), v: rand(1.4, 2.2) });

/* ---------- cars ---------- */
var BODIES = {
  'coupe':         { lower: 0.30, cabinW: 0.66, cabinTopW: 0.50, cabin: 0.20, clear: 0.05, tire: 0.16, tireW: 0.15 },
  'supercar':      { lower: 0.25, cabinW: 0.60, cabinTopW: 0.42, cabin: 0.15, clear: 0.04, tire: 0.15, tireW: 0.16 },
  'sedan':         { lower: 0.31, cabinW: 0.72, cabinTopW: 0.58, cabin: 0.24, clear: 0.06, tire: 0.16, tireW: 0.14 },
  'hatchback':     { lower: 0.32, cabinW: 0.78, cabinTopW: 0.64, cabin: 0.28, clear: 0.06, tire: 0.15, tireW: 0.14 },
  'muscle':        { lower: 0.33, cabinW: 0.64, cabinTopW: 0.52, cabin: 0.20, clear: 0.06, tire: 0.18, tireW: 0.17 },
  'suv':           { lower: 0.38, cabinW: 0.84, cabinTopW: 0.74, cabin: 0.30, clear: 0.11, tire: 0.20, tireW: 0.15 },
  'pickup':        { lower: 0.36, cabinW: 0.70, cabinTopW: 0.60, cabin: 0.26, clear: 0.12, tire: 0.20, tireW: 0.15 },
  'van':           { lower: 0.48, cabinW: 0.90, cabinTopW: 0.86, cabin: 0.36, clear: 0.07, tire: 0.16, tireW: 0.13 },
  'monster-truck': { lower: 0.34, cabinW: 0.62, cabinTopW: 0.52, cabin: 0.24, clear: 0.44, tire: 0.58, tireW: 0.25 }
};

function playerLook() {
  return {
    body: CAR.body, main: CAR.colors.main, stripes: CAR.colors.stripes, layout: CAR.stripes.layout,
    over: CAR.stripes.over, spoiler: CAR.spoiler, spoilerColor: CAR.colors.spoiler, rims: CAR.colors.rims,
    glass: CAR.colors.glass, plate: CAR.plate, decals: CAR.decals, exhausts: CAR.exhausts,
    bigWheels: CAR.wheels === 'big'
  };
}
function simpleLook(body, main, layout, stripe, spoiler) {
  return {
    body: body, main: main, stripes: [stripe || '#ffffff'], layout: layout || 'none', over: ['roof', 'trunk'],
    spoiler: spoiler || 'none', spoilerColor: shade(main, -0.5), rims: '#b8bcc2', glass: '#1d2731',
    plate: '', decals: [], exhausts: 2, bigWheels: false
  };
}

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
function trap(cx, yb, wb, yt, wt, lean) {
  ctx.beginPath();
  ctx.moveTo(cx - wb / 2, yb); ctx.lineTo(cx + wb / 2, yb);
  ctx.lineTo(cx + lean + wt / 2, yt); ctx.lineTo(cx + lean - wt / 2, yt);
  ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function stripeBands(layout, w) {
  if (layout === 'single') return [[0, w * 0.17]];
  if (layout === 'twin') return [[-w * 0.06, w * 0.08], [w * 0.06, w * 0.08]];
  if (layout === 'triple') return [[-w * 0.075, w * 0.05], [0, w * 0.05], [w * 0.075, w * 0.05]];
  if (layout === 'offset') return [[-w * 0.2, w * 0.1]];
  return [];
}

/* Draws a car seen from behind. cx = centre, by = ground line, w = width in pixels. */
function drawCar(L, cx, by, w, o) {
  if (w < 1.5) return;
  var fogT = o.fog || 0;
  function F(c) { return fogT > 0.02 ? mix(c, T.fog, fogT) : c; }
  var B = BODIES[L.body] || BODIES.coupe;
  var monster = L.body === 'monster-truck';
  if (w < 7) {
    var hh = w * (B.lower + B.cabin + B.clear);
    ctx.fillStyle = F(L.main); ctx.fillRect(cx - w / 2, by - hh, w, hh);
    return;
  }
  var detail = w > 26;
  var lean = (o.lean || 0) * w * 0.05;
  var wheelScale = (L.bigWheels && !monster) ? 1.25 : 1;
  var clear = B.clear * w * (L.bigWheels && !monster ? 1.6 : 1);
  var tireH = B.tire * w * wheelScale, tireW = B.tireW * w;

  ctx.fillStyle = 'rgba(0,0,0,' + (0.45 * (1 - fogT)).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(cx, by, w * 0.56, w * 0.06, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = F('#121212');
  rr(cx - w / 2, by - tireH, tireW, tireH, tireW * 0.25); ctx.fill();
  rr(cx + w / 2 - tireW, by - tireH, tireW, tireH, tireW * 0.25); ctx.fill();
  if (detail) {
    if (monster) {
      ctx.fillStyle = F('#2c2c2c');
      for (var k = 1; k < 7; k++) {
        ctx.fillRect(cx - w / 2, by - tireH * k / 7, tireW, Math.max(1, tireH * 0.035));
        ctx.fillRect(cx + w / 2 - tireW, by - tireH * k / 7, tireW, Math.max(1, tireH * 0.035));
      }
    }
    ctx.fillStyle = F(L.rims);
    ctx.fillRect(cx - w / 2 + tireW * 0.78, by - tireH * 0.72, tireW * 0.16, tireH * 0.44);
    ctx.fillRect(cx + w / 2 - tireW * 0.94, by - tireH * 0.72, tireW * 0.16, tireH * 0.44);
  }
  if (monster) {
    ctx.fillStyle = F('#2b2b2b');
    ctx.fillRect(cx - w * 0.38, by - tireH * 0.56, w * 0.76, w * 0.05);
    ctx.fillStyle = F('#d6b019');
    ctx.fillRect(cx - w * 0.25, by - clear, w * 0.04, clear - tireH * 0.5);
    ctx.fillRect(cx + w * 0.21, by - clear, w * 0.04, clear - tireH * 0.5);
  }

  var bw = w * (monster ? 0.72 : 0.96), tw = bw * 0.93;
  var yb = by - clear, yt = yb - B.lower * w;
  function bodyPath() {
    var r = w * 0.05;
    ctx.beginPath();
    ctx.moveTo(cx - bw / 2, yb); ctx.lineTo(cx + bw / 2, yb);
    ctx.lineTo(cx + tw / 2, yt + r); ctx.quadraticCurveTo(cx + tw / 2, yt, cx + tw / 2 - r, yt);
    ctx.lineTo(cx - tw / 2 + r, yt); ctx.quadraticCurveTo(cx - tw / 2, yt, cx - tw / 2, yt + r);
    ctx.closePath();
  }
  var g = ctx.createLinearGradient(0, yt, 0, yb);
  g.addColorStop(0, F(shade(L.main, 0.28)));
  g.addColorStop(0.45, F(L.main));
  g.addColorStop(1, F(shade(L.main, -0.35)));
  ctx.fillStyle = g; bodyPath(); ctx.fill();

  var bands = stripeBands(L.layout, w), i;
  var over = L.over || [];
  if (L.layout === 'side') {
    ctx.save(); bodyPath(); ctx.clip();
    ctx.fillStyle = F(L.stripes[0]);
    ctx.fillRect(cx - bw, yt + (yb - yt) * 0.42, bw * 2, w * 0.045);
    if (L.stripes.length > 1) { ctx.fillStyle = F(L.stripes[1]); }
    ctx.fillRect(cx - bw, yt + (yb - yt) * 0.42 + w * 0.06, bw * 2, w * 0.015);
    ctx.restore();
  } else if (bands.length && over.indexOf('trunk') >= 0) {
    ctx.save(); bodyPath(); ctx.clip();
    for (i = 0; i < bands.length; i++) {
      ctx.fillStyle = F(L.stripes[i % L.stripes.length]);
      ctx.fillRect(cx + bands[i][0] - bands[i][1] / 2, yt - 2, bands[i][1], yb - yt + 4);
    }
    ctx.restore();
  }

  ctx.fillStyle = F(shade(L.main, -0.5));
  rr(cx - bw / 2 + w * 0.01, yb - w * 0.07, bw - w * 0.02, w * 0.07, w * 0.02); ctx.fill();
  if (L.body === 'supercar' && detail) {
    ctx.fillStyle = F('#151515');
    for (i = -3; i <= 3; i++) ctx.fillRect(cx + i * w * 0.05 - w * 0.006, yb - w * 0.065, w * 0.012, w * 0.06);
  }

  var cy = yt - B.cabin * w, cwb = B.cabinW * w, cwt = B.cabinTopW * w, roofH = w * 0.035;
  ctx.fillStyle = F(shade(L.main, 0.12));
  trap(cx, yt + 1, cwb, cy, cwt, lean); ctx.fill();
  var gi = w * 0.03;
  var gg = ctx.createLinearGradient(0, cy, 0, yt);
  gg.addColorStop(0, F(shade(L.glass, 0.3)));
  gg.addColorStop(1, F(L.glass));
  ctx.fillStyle = gg;
  trap(cx + lean * 0.05, yt - gi * 0.3, cwb - gi * 2.2, cy + roofH, cwt - gi * 1.4, lean * 0.9); ctx.fill();
  if (detail) {
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.moveTo(cx - cwb * 0.25, yt - gi * 0.4); ctx.lineTo(cx - cwb * 0.1, yt - gi * 0.4);
    ctx.lineTo(cx + lean * 0.8 - cwt * 0.05, cy + roofH); ctx.lineTo(cx + lean * 0.8 - cwt * 0.2, cy + roofH);
    ctx.closePath(); ctx.fill();
  }
  if (bands.length && over.indexOf('roof') >= 0 && L.layout !== 'side') {
    ctx.save();
    var rb = cwt + (cwb - cwt) * (roofH / Math.max(1, B.cabin * w));
    trap(cx + lean * 0.9, cy + roofH, rb, cy, cwt, lean * 0.1); ctx.clip();
    for (i = 0; i < bands.length; i++) {
      ctx.fillStyle = F(L.stripes[i % L.stripes.length]);
      var bwid = bands[i][1] * (cwt / cwb + 0.15);
      ctx.fillRect(cx + lean + bands[i][0] * 0.9 - bwid / 2, cy - 2, bwid, roofH + 4);
    }
    ctx.restore();
  }

  var lw = w * 0.2, lh = w * 0.055, ly = yt + w * 0.045;
  if (o.glow) { ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = w * (o.brake ? 0.25 : 0.12); }
  ctx.fillStyle = F(o.brake ? '#ff4545' : '#b8101a');
  rr(cx - tw / 2 + w * 0.025, ly, lw, lh, lh * 0.3); ctx.fill();
  rr(cx + tw / 2 - w * 0.025 - lw, ly, lw, lh, lh * 0.3); ctx.fill();
  ctx.shadowBlur = 0;
  if (detail) {
    ctx.fillStyle = F(o.brake ? '#ffd0d0' : '#ff6b6b');
    ctx.fillRect(cx - tw / 2 + w * 0.04, ly + lh * 0.3, lw * 0.4, lh * 0.3);
    ctx.fillRect(cx + tw / 2 - w * 0.04 - lw * 0.4, ly + lh * 0.3, lw * 0.4, lh * 0.3);
  }

  if (L.plate && w > 18) {
    var pw = w * 0.24, ph = w * 0.075, px = cx - pw / 2, py = yb - w * 0.07 - ph - w * 0.012;
    ctx.fillStyle = F('#f1f1e8'); rr(px, py, pw, ph, ph * 0.15); ctx.fill();
    ctx.strokeStyle = F('#222222'); ctx.lineWidth = Math.max(1, w * 0.004); ctx.stroke();
    if (w > 60) {
      ctx.fillStyle = F('#15151a');
      ctx.font = 'bold ' + Math.round(ph * 0.72) + 'px Consolas, "Courier New", monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(L.plate, cx, py + ph * 0.56, pw * 0.9);
    }
  }
  if (L.decals && L.decals.length && w > 40) {
    ctx.font = 'italic bold ' + Math.round(w * 0.07) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

/* ---------- racers and traffic ---------- */

var player = { look: playerLook() };

function setupRace() {

    var layout = ['single', 'none', 'twin', 'offset'][i % 4];
    var stripe = colourDistance(col, '#ffffff') > 200 ? '#ffffff' : '#111111';
    var z = PLAYER_Z + SEG * 5 * (i + 1);
    rivals.push({
      kind: 'rival', name: RIVAL_NAMES[i % RIVAL_NAMES.length], look: simpleLook(body, col, layout, stripe, i % 2 ? 'big' : 'small'),
      startZ: z, z: wrapZ(z), dist: 0, offset: (i % 2 === 0) ? -0.45 : 0.45, lane: (i % 2 === 0) ? -0.45 : 0.45,
      speed: 0, skill: 0.92 + 0.025 * (i % 3) + r() * 0.02, finished: false, finishTime: 0

    police = { kind: 'police', look: pl, z: wrapZ(PLAYER_Z - SEG * 28), offset: 0, lane: 0, speed: 0 };
  }
  allCars = rivals.concat(traffic);
  if (police) allCars.push(police);

  position = 0; playerX = RACE.rivals % 2 === 0 ? -0.45 : 0.45; speed = 0; nitro = 1; playerDist = 0;
  lean = 0; shake = 0; raceTime = 0; lapStart = 0; bestLap = 0; lapTimes = []; finishTime = 0;
  finishPlace = 0; busts = 0; message = ''; messageTimer = 0; standings = [];
}
setupRace();

function playerCarZ() { return wrapZ(position + PLAYER_Z); }

function update(dt) {

  var y = by - shopH;
  ctx.fillStyle = mix(shade(b.color, -0.45), T.fog, f); ctx.fillRect(x0, y, dw, shopH);
  ctx.fillStyle = mix(NIGHT ? '#f2c27a' : '#5d7385', T.fog, f);
  ctx.fillRect(x0 + dw * 0.08, y + shopH * 0.38, dw * 0.84, shopH * 0.62);
  ctx.fillStyle = mix(b.awning, T.fog, f); ctx.fillRect(x0 + dw * 0.04, y + shopH * 0.2, dw * 0.92, shopH * 0.18);
  if (b.sign && dw > 60) {
    var bh = 320 * s;
    ctx.fillStyle = mix('#151515', T.fog, f); ctx.fillRect(x0 + dw * 0.16, y - bh * 1.05, dw * 0.68, bh);
    ctx.font = 'bold ' + Math.round(bh * 0.66) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (NIGHT) { ctx.shadowColor = b.neon; ctx.shadowBlur = bh * 0.6; }
    ctx.fillStyle = mix(b.neon, T.fog, f * 0.7);
    ctx.fillText(b.sign, x0 + dw / 2, y - bh * 0.53, dw * 0.62);
    ctx.shadowBlur = 0;
  }
}

function drawLamp(sp, sx, by, s, f) {
  var h = 2800 * s;
  if (h < 2 || sx < -W * 0.5 || sx > W * 1.5) return;
  var pw = Math.max(1, 70 * s), dir = sp.offset < 0 ? 1 : -1, arm = 520 * s;
  ctx.fillStyle = mix('#3a3d42', T.fog, f);
  ctx.fillRect(sx - pw / 2, by - h, pw, h);
  ctx.fillRect(dir > 0 ? sx : sx - arm, by - h, arm, Math.max(1, pw * 0.8));
  var hx = sx + dir * arm;
  ctx.fillStyle = NIGHT ? '#fff1c4' : mix('#d9d9d9', T.fog, f);
  ctx.fillRect(hx - 100 * s, by - h + pw * 0.8, 200 * s, Math.max(1, 60 * s));
  if (NIGHT && h > 10) {
    var gy = by - h + pw, r = 1000 * s;
    var gr = ctx.createRadialGradient(hx, gy, 0, hx, gy, r);
    gr.addColorStop(0, 'rgba(255,220,150,' + (0.35 * (1 - f)).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,220,150,0)');
    ctx.fillStyle = gr; ctx.fillRect(hx - r, gy - r, 2 * r, 2 * r);
  }
}

function drawBanner(seg, f) {
  var p = seg.p1.screen, s = p.scale * W / 2;
  var xl = p.x - p.w * 1.2, xr = p.x + p.w * 1.2, h = 3000 * s, bh = 480 * s, pw = Math.max(1, 110 * s);
  if (h < 3) return;
  ctx.fillStyle = mix('#2d2f34', T.fog, f);
  ctx.fillRect(xl - pw / 2, p.y - h, pw, h); ctx.fillRect(xr - pw / 2, p.y - h, pw, h);
  var top = p.y - h, n = 20, cw = (xr - xl) / n;
  for (var i = 0; i < n; i++) {
    for (var j = 0; j < 2; j++) {
      ctx.fillStyle = mix((i + j) % 2 ? '#111111' : '#f4f4f4', T.fog, f);
      ctx.fillRect(xl + i * cw, top + j * bh / 2, cw + 1, bh / 2 + 1);
    }
  }
  if (xr - xl > 120) {
    ctx.fillStyle = mix('#b8222c', T.fog, f);
    ctx.fillRect(xl + (xr - xl) * 0.32, top - bh * 0.95, (xr - xl) * 0.36, bh * 0.95);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(bh * 0.62) + 'px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('START  FINISH', p.x, top - bh * 0.47, (xr - xl) * 0.34);
  }
}

function drawSprites(seg) {
  var p = seg.p1.screen, s = p.scale * W / 2, f = seg.fog;
  for (var i = 0; i < seg.sprites.length; i++) {
    var sp = seg.sprites[i];
    if (sp.kind === 'banner') { drawBanner(seg, f); continue; }
    var sx = p.x + s * sp.offset * ROAD_W;
    if (sp.kind === 'building') drawBuilding(sp, sx, p.y, s, f);
    else if (sp.kind === 'lamp') drawLamp(sp, sx, p.y, s, f);
  }
}

function drawCars(seg) {
  if (!seg.cars.length) return;
  seg.cars.sort(function (a, b) { return (b.z % SEG) - (a.z % SEG); });
  var p1 = seg.p1.screen, p2 = seg.p2.screen;
  for (var i = 0; i < seg.cars.length; i++) {
    var c = seg.cars[i];
    var t = (c.z % SEG) / SEG;
    var sc = p1.scale + (p2.scale - p1.scale) * t;
    var x = p1.x + (p2.x - p1.x) * t + sc * c.offset * ROAD_W * W / 2;
    var y = p1.y + (p2.y - p1.y) * t;
    var w = CAR_W * sc * W / 2;
    if (x + w < 0 || x - w > W || w > W * 1.2) continue;
    drawCar(c.look, x, y, w, { fog: seg.fog, glow: NIGHT && w > 14, brake: false, lightbar: c.kind === 'police' });
    if (c.kind === 'rival' && w > 30 && w < W * 0.5) {
      ctx.font = 'bold ' + Math.round(Math.max(10, w * 0.1)) + 'px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * (1 - seg.fog)).toFixed(3) + ')';
      ctx.fillText(c.name, x, y - w * 0.75);
    }
  }
}

function placeCars() {
  for (var i = 0; i < touched.length; i++) touched[i].cars.length = 0;
  touched.length = 0;
  for (var j = 0; j < allCars.length; j++) {
    var s = findSegment(allCars[j].z);
    s.cars.push(allCars[j]);
    touched.push(s);
  }
}

function drawPlayer() {
  var w = CAR_W * (CAM_D / PLAYER_Z) * W / 2;
  var bounce = speed > 0 ? Math.sin(clock * 40) * Math.min(1, speed / MAX_SPEED) * H * 0.0018 : 0;
  var off = Math.abs(playerX) > 1 ? (Math.random() - 0.5) * H * 0.006 * (speed / MAX_SPEED) : 0;
  var by = H - H * 0.035 + bounce + off;
  if (NIGHT) {
    var g = ctx.createLinearGradient(0, by - w * 0.6, 0, H * 0.55);
    g.addColorStop(0, 'rgba(255,240,200,0.22)'); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(W / 2 - w * 0.45, by - w * 0.5); ctx.lineTo(W / 2 + w * 0.45, by - w * 0.5);
    ctx.lineTo(W / 2 + w * 1.6, H * 0.55); ctx.lineTo(W / 2 - w * 1.6, H * 0.55); ctx.closePath(); ctx.fill();
  }
  drawCar(player.look, W / 2 + lean * w * 0.04, by, w, {
    fog: 0, lean: lean, brake: keys.down && state === 'race', nitro: nitroOn, glow: NIGHT || (keys.down && state === 'race')
  });
}

function fogAt(n) { var d = n / DRAW; return 1 - 1 / Math.exp(d * d * FOG_DENSITY); }

function renderWorld() {
  var base = findSegment(position);
  var basePercent = (position % SEG) / SEG;
  var pSeg = findSegment(position + PLAYER_Z);
  var pPercent = ((position + PLAYER_Z) % SEG) / SEG;
  playerY = pSeg.p1.world.y + (pSeg.p2.world.y - pSeg.p1.world.y) * pPercent;
  drawSky();
  drawSkyline();
  placeCars();
  var x = 0, dx = -(base.curve * basePercent), list = [], n, seg;
  for (n = 0; n < DRAW; n++) {
    seg = segments[(base.index + n) % segments.length];
    var camZ = position - (seg.index < base.index ? TRACK_LEN : 0);
    project(seg.p1, playerX * ROAD_W - x, playerY + CAM_H, camZ);
    project(seg.p2, playerX * ROAD_W - x - dx, playerY + CAM_H, camZ);
    x += dx; dx += seg.curve;
    seg.fog = fogAt(n);
    seg.visible = seg.p1.camera.z > CAM_D && seg.p2.screen.y < seg.p1.screen.y;
    list.push(seg);
  }
  var playerSeen = false;
  for (n = DRAW - 1; n >= 0; n--) {
    seg = list[n];
    if (seg.visible) drawSegment(seg);
    if (seg.p1.camera.z > CAM_D) {
      if (!playerSeen) drawSprites(seg);
      drawCars(seg);
    }
    if (seg === pSeg) { drawPlayer(); playerSeen = true; }
  }
}

function drawRain() {
  if (!RAIN) return;
  ctx.strokeStyle = NIGHT ? 'rgba(170,185,215,0.35)' : 'rgba(210,220,235,0.45)';
  ctx.lineWidth = Math.max(1, U * 1.2);
  ctx.beginPath();
  var drift = 0.3 + speed / MAX_SPEED * 0.6;
  for (var i = 0; i < DROPS.length; i++) {
    var d = DROPS[i];
    if (!paused) { d.y += d.v * 0.016 * (1 + speed / MAX_SPEED); if (d.y > 1.1) { d.y = -0.1; d.x = Math.random(); } }
    var x = d.x * W, y = d.y * H;
    ctx.moveTo(x, y); ctx.lineTo(x - d.l * H * 0.25 * drift, y + d.l * H);
  }
  ctx.stroke();
}

function drawSpeedLines() {
  if (!nitroOn) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = Math.max(1, U * 2);
  ctx.beginPath();
  for (var i = 0; i < 26; i++) {
    var a = Math.random() * Math.PI * 2, r1 = Math.max(W, H) * (0.35 + Math.random() * 0.2);
    var r2 = r1 + Math.max(W, H) * 0.25;
    ctx.moveTo(W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1 * 0.6);
    ctx.lineTo(W / 2 + Math.cos(a) * r2, H / 2 + Math.sin(a) * r2 * 0.6);
  }
  ctx.stroke();
}

/* ---------- HUD ---------- */
function font(px, weight) { return (weight || 'bold') + ' ' + Math.round(px) + 'px "Segoe UI", system-ui, Arial, sans-serif'; }
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(0,0,0,0.55)'; rr(x, y, w, h, 10 * U); ctx.fill(); }
function fmt(t) {
  if (!t && t !== 0) return '--';
  var m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
}
function ordinal(n) { return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'); }

function drawHUD() {
  var u = U, total = rivals.length + 1;
  panel(16 * u, 16 * u, 250 * u, 150 * u);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#aab3c0'; ctx.font = font(15 * u);
  ctx.fillText('POSITION', 32 * u, 44 * u);
  ctx.fillStyle = '#ffffff'; ctx.font = font(52 * u, '900');
  var rank = state === 'finished' ? finishPlace : playerRank();
  ctx.fillText(rank + '/' + total, 30 * u, 96 * u);
  var lap = Math.min(RACE.laps, Math.floor(playerDist / TRACK_LEN) + 1);
  ctx.font = font(18 * u);
  ctx.fillText('LAP ' + lap + '/' + RACE.laps, 150 * u, 72 * u);
  ctx.fillStyle = '#aab3c0'; ctx.font = font(15 * u, '600');
  ctx.fillText('TIME  ' + fmt(state === 'finished' ? finishTime : raceTime), 32 * u, 126 * u);
  ctx.fillText('BEST  ' + (bestLap ? fmt(bestLap) : '--'), 32 * u, 150 * u);

  var name = CAR.name;
  ctx.font = font(18 * u);
  var nw = Math.min(W * 0.4, ctx.measureText(name).width + 40 * u);
  panel(W - nw - 16 * u, 16 * u, nw, 40 * u);
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center';
  ctx.fillText(name, W - nw / 2 - 16 * u, 43 * u, nw - 20 * u);

  var r = 92 * u, cx = W - r - 34 * u, cy = H - r - 58 * u;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; circle(cx, cy, r + 10 * u);
  var a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, maxKmh = 360;
  ctx.lineWidth = 6 * u; ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(cx, cy, r - 6 * u, a0, a1); ctx.stroke();
  var kmh = Math.round(speed / MAX_SPEED * 240);
  ctx.strokeStyle = nitroOn ? '#5ad1ff' : CAR.colors.stripes[0] || '#ffffff';
  ctx.beginPath(); ctx.arc(cx, cy, r - 6 * u, a0, a0 + (a1 - a0) * Math.min(1, kmh / maxKmh)); ctx.stroke();
  ctx.fillStyle = '#d0d6de'; ctx.font = font(11 * u, '600'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var k = 0; k <= maxKmh; k += 40) {
    var a = a0 + (a1 - a0) * k / maxKmh;
    ctx.fillText(String(k), cx + Math.cos(a) * (r - 24 * u), cy + Math.sin(a) * (r - 24 * u));
  }
  var na = a0 + (a1 - a0) * Math.min(1, kmh / maxKmh);
  ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 3 * u;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(na) * (r - 14 * u), cy + Math.sin(na) * (r - 14 * u)); ctx.stroke();
  ctx.fillStyle = '#ffffff'; circle(cx, cy, 5 * u);
  ctx.font = font(30 * u, '900'); ctx.fillText(String(kmh), cx, cy + 36 * u);
  ctx.font = font(11 * u, '600'); ctx.fillStyle = '#aab3c0'; ctx.fillText('KM/H', cx, cy + 58 * u);

  var bw = 2 * r, bx = cx - r, by = H - 36 * u;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; rr(bx - 4 * u, by - 4 * u, bw + 8 * u, 22 * u, 6 * u); ctx.fill();
  var ng = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  ng.addColorStop(0, '#2f6bff'); ng.addColorStop(1, '#5ad1ff');
  ctx.fillStyle = ng; rr(bx, by, Math.max(1, bw * nitro), 14 * u, 4 * u); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = font(10 * u); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('NITROUS (SHIFT)', bx + 6 * u, by + 7 * u);

  if (police && state === 'race') {
    var back = ahead(playerCarZ(), police.z);
    if (back < SEG * 45) {
      var flash = Math.floor(clock * 4) % 2 === 0;
      panel(W / 2 - 110 * u, 16 * u, 220 * u, 40 * u);
      ctx.fillStyle = flash ? '#ff3b30' : '#5aa0ff'; ctx.font = font(18 * u); ctx.textAlign = 'center';
      ctx.fillText('POLICE ' + Math.round(back / 10) + ' m BEHIND', W / 2, 37 * u);
    }
  }
  if (messageTimer > 0 && message) {
    ctx.font = font(44 * u, '900'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6 * u; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(message, W / 2, H * 0.3); ctx.fillStyle = '#ffd23f'; ctx.fillText(message, W / 2, H * 0.3);
  }
  if (nitroOn) {
    ctx.font = font(22 * u, '900'); ctx.textAlign = 'center'; ctx.fillStyle = '#5ad1ff';
    ctx.fillText('NITROUS', W / 2, H * 0.4);
  }
}

function centreText(text, y, px, colour) {
  ctx.font = font(px, '900'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = px * 0.12; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
  ctx.strokeText(text, W / 2, y, W * 0.92);
  ctx.fillStyle = colour || '#ffffff'; ctx.fillText(text, W / 2, y, W * 0.92);
}

function drawOverlay() {
  var u = U;
  if (state === 'title') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H * 0.62);
    centreText('SKETCH TO RACE', H * 0.12, 26 * u, '#ffd23f');
    centreText(CAR.name, H * 0.22, 64 * u);
    centreText(RACE.laps + ' LAPS  ·  ' + RACE.rivals + ' RIVALS  ·  ' + RACE.traffic.toUpperCase() + ' TRAFFIC' + (RACE.police ? '  ·  POLICE' : ''), H * 0.31, 20 * u, '#d0d6de');
    if (Math.floor(clock * 2) % 2 === 0) centreText('PRESS ENTER TO RACE', H * 0.41, 34 * u, '#ffffff');
    centreText('ARROWS steer, gas, brake   ·   SHIFT nitrous   ·   R back on track   ·   P pause', H * 0.5, 16 * u, '#d0d6de');
  } else if (state === 'countdown') {
    var n = Math.ceil(countdown - 0.2);
    if (n > 0 && n <= 3) centreText(String(n), H * 0.33, 120 * u, '#ffd23f');
  } else if (state === 'race' && goTimer > 0) {
    centreText('GO!', H * 0.33, 120 * u, '#4cff6a');
  } else if (state === 'finished') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    centreText('FINISHED', H * 0.14, 30 * u, '#ffd23f');
    centreText(finishPlace === 1 ? 'YOU WIN!' : 'YOU PLACED ' + ordinal(finishPlace).toUpperCase(), H * 0.25, 64 * u);
    centreText('TIME ' + fmt(finishTime) + '   ·   BEST LAP ' + fmt(bestLap) + (RACE.police ? '   ·   PULLED OVER ' + busts + 'x' : ''), H * 0.35, 20 * u, '#d0d6de');
    ctx.font = font(20 * u); ctx.textBaseline = 'middle';
    for (var i = 0; i < standings.length; i++) {
      var y = H * 0.44 + i * 30 * u;
      ctx.fillStyle = standings[i].colour; rr(W / 2 - 120 * u, y - 9 * u, 18 * u, 18 * u, 4 * u); ctx.fill();
      ctx.textAlign = 'left'; ctx.fillStyle = standings[i].you ? '#ffd23f' : '#ffffff';
      ctx.fillText((i + 1) + '.  ' + standings[i].name, W / 2 - 90 * u, y);
    }
    if (Math.floor(clock * 2) % 2 === 0) centreText('PRESS ENTER TO RACE AGAIN', H * 0.44 + standings.length * 30 * u + 34 * u, 28 * u);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    centreText('PAUSED', H * 0.4, 70 * u); centreText('Press P to keep racing', H * 0.5, 20 * u, '#d0d6de');
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 18 * U, (Math.random() - 0.5) * shake * 12 * U);
  renderWorld();
  drawRain();
  drawSpeedLines();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state !== 'title') drawHUD();
  drawOverlay();
}

var last = performance.now(), acc = 0, STEP = 1 / 60;
function frame(now) {
  var dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now; acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  window.requestAnimationFrame(frame);
}
window.requestAnimationFrame(frame);

/* read-only status for testing tools */
function laneGaps() {
  var pz = playerCarZ();
  return LANE_X.map(function (lane) {
    var best = 99;
    for (var i = 0; i < allCars.length; i++) {
      var dz = ahead(allCars[i].z, pz) / SEG;
      if (dz < best && Math.abs(allCars[i].offset - lane) < 0.4) best = Math.round(dz);
    }
    return best;
  });
}
window.SKETCH_TO_RACE = {
  status: function () {
    return {
      state: state, paused: paused, kmh: Math.round(speed / MAX_SPEED * 240), lap: Math.min(RACE.laps, Math.floor(playerDist / TRACK_LEN) + 1),
      laps: RACE.laps, position: state === 'finished' ? finishPlace : playerRank(), racers: rivals.length + 1,
      nitro: Math.round(nitro * 100), x: Math.round(playerX * 100) / 100, lanes: laneGaps(), traffic: traffic.length, police: !!police, car: CAR.name, segments: segments.length
    };
  }
};
})();
</script>
